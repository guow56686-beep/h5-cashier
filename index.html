
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能收银台</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    header {
      height: 74px;
      background: linear-gradient(90deg, #0876bd, #174da1);
      color: white;
      display: flex;
      align-items: center;
      padding: 0 24px;
      font-size: 19px;
      font-weight: bold;
    }

    .logo {
      width: 42px;
      height: 36px;
      border: 2px solid white;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 25px;
    }

    main {
      width: min(514px, calc(100% - 28px));
      min-height: 600px;
      margin: 42px auto;
      padding: 58px 34px;
      background: white;
      border: 1px solid #eee;
    }

    .avatar {
      width: 74px;
      height: 74px;
      margin: 0 auto 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #08a8d5, #00c69a);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .amount-wrap {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding: 0 8px 12px;
    }

    .currency {
      font-size: 22px;
      margin-right: 20px;
    }

    input {
      width: 100%;
      min-width: 0;
      border: none;
      outline: none;
      font-size: 42px;
      color: #555;
      background: transparent;
    }

    .note {
      width: 100%;
      margin: 26px 0 30px;
      padding: 14px 4px;
      border: none;
      border-bottom: 1px solid #ddd;
      outline: none;
      font-size: 15px;
    }

    .method {
      border: 1px solid #eee;
      padding: 20px 16px 16px;
      margin-top: 30px;
    }

    .method-title {
      text-align: center;
      margin-bottom: 14px;
      font-weight: bold;
    }

    .single-option {
      border: 1px solid #aab2ba;
      border-radius: 5px;
      min-height: 52px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
    }

    .check {
      color: #0876bd;
      font-size: 20px;
    }

    button {
      display: block;
      width: 70%;
      min-height: 53px;
      margin: 16px auto 0;
      border: none;
      border-radius: 28px;
      background: #0876bd;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .tip {
      margin-top: 20px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 480px) {
      header { height: 60px; }
      main {
        margin: 20px auto;
        padding: 38px 22px;
      }
      input { font-size: 36px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">¥</div>
    <span>智能收银台</span>
  </header>

  <main>
    <div class="avatar">♙</div>

    <div class="amount-wrap">
      <span class="currency">¥</span>
      <input
        id="amount"
        type="number"
        min="0.01"
        max="1000000"
        step="0.01"
        placeholder="0.00"
        inputmode="decimal"
      >
    </div>

    <input
      id="note"
      class="note"
      type="text"
      maxlength="100"
      placeholder="✎ 备注（选填）"
    >

    <section class="method">
      <div class="method-title">支付方式</div>
      <div class="single-option">
        <span>支付宝大额 UID</span>
        <span class="check">✓</span>
      </div>
    </section>

    <button id="payButton" type="button">立即支付</button>

    <div id="result" role="status"></div>

    <div class="tip">
      点击立即支付后，将跳转至 UID 支付页面，请在该页面填写支付金额。
    </div>
  </main>

  <script>
    const payButton = document.getElementById("payButton");

    payButton.addEventListener("click", () => {
      window.location.href =
        "https://api.sf2027.xyz/Pay_Charges_index_mid_10867.html";
    });
  </script>
</body>
</html>
