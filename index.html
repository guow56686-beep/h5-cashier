
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0876bd">
  <title>智能收银台</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    header {
      height: 74px;
      background: linear-gradient(90deg, #0876bd, #174da1);
      color: white;
      display: flex;
      align-items: center;
      padding: 0 24px;
      font-size: 19px;
      font-weight: bold;
    }

    .logo {
      width: 42px;
      height: 36px;
      border: 2px solid white;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 25px;
    }

    main {
      width: min(514px, calc(100% - 28px));
      min-height: 600px;
      margin: 42px auto;
      padding: 58px 34px;
      background: white;
      border: 1px solid #eee;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(25, 60, 100, 0.06);
    }

    .avatar {
      width: 74px;
      height: 74px;
      margin: 0 auto 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #08a8d5, #00c69a);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .amount-wrap {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding: 0 8px 12px;
    }

    .currency {
      font-size: 22px;
      margin-right: 20px;
    }

    #amount {
      width: 100%;
      min-width: 0;
      border: none;
      outline: none;
      font-size: 42px;
      color: #555;
      background: transparent;
    }

    .note {
      width: 100%;
      margin: 26px 0 30px;
      padding: 14px 4px;
      border: none;
      border-bottom: 1px solid #ddd;
      outline: none;
      font-size: 15px;
    }

    .method {
      border: 1px solid #eee;
      padding: 20px 16px 16px;
      margin-top: 30px;
    }

    .method-title {
      text-align: center;
      margin-bottom: 14px;
      font-weight: bold;
    }

    .single-option {
      border: 1px solid #aab2ba;
      border-radius: 5px;
      min-height: 52px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
    }

    .check {
      color: #0876bd;
      font-size: 20px;
    }

    button {
      display: block;
      width: 70%;
      min-height: 53px;
      margin: 16px auto 0;
      border: none;
      border-radius: 28px;
      background: #0876bd;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      text-align: center;
    }

    #result.error {
      color: #c62828;
    }

    #result.success {
      color: #237a45;
    }

    .tip {
      margin-top: 20px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 480px) {
      header {
        height: 60px;
      }

      main {
        margin: 20px auto;
        padding: 38px 22px;
      }

      #amount {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">¥</div>
    <span>智能收银台</span>
  </header>

  <main>
    <div class="avatar" aria-hidden="true">♙</div>

    <form id="paymentForm">
      <div class="amount-wrap">
        <span class="currency">¥</span>
        <input
          id="amount"
          name="amount"
          type="number"
          min="0.01"
          max="1000000"
          step="0.01"
          placeholder="0.00"
          inputmode="decimal"
          required
        >
      </div>

      <input
        id="note"
        class="note"
        name="note"
        type="text"
        maxlength="100"
        placeholder="✎ 备注（选填）"
      >

      <section class="method">
        <div class="method-title">支付方式</div>
        <div class="single-option">
          <span>支付宝大额 UID</span>
          <span class="check" aria-label="已选择">✓</span>
        </div>
      </section>

      <button id="payButton" type="submit">立即支付</button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>

    <div class="tip">
      提示：提交后将尝试创建支付订单；是否付款成功以支付网关和商户订单核验结果为准。
    </div>
  </main>

  <script>
    const paymentForm = document.getElementById("paymentForm");
    const payButton = document.getElementById("payButton");
    const amountInput = document.getElementById("amount");
    const noteInput = document.getElementById("note");
    const result = document.getElementById("result");

    function showMessage(message, type) {
      result.textContent = message;
      result.className = type || "";
    }

    paymentForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const amount = amountInput.value.trim();
      const note = noteInput.value.trim();

      showMessage("", "");

      if (!/^\d{1,7}(\.\d{1,2})?$/.test(amount)) {
        showMessage("请输入有效金额，最多保留两位小数。", "error");
        amountInput.focus();
        return;
      }

      const numericAmount = Number(amount);

      if (
        !Number.isFinite(numericAmount) ||
        numericAmount < 0.01 ||
        numericAmount > 1000000
      ) {
        showMessage("金额必须在 0.01 至 1000000 元之间。", "error");
        amountInput.focus();
        return;
      }

      payButton.disabled = true;
      payButton.textContent = "正在创建支付订单…";

      try {
        const response = await fetch("/api/order", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            amount: amount,
            note: note
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("服务器返回的数据无法识别，请检查服务器日志。");
        }

        if (!response.ok || !data.success) {
          throw new Error(data.message || "创建支付订单失败。");
        }

        if (
          typeof data.paymentUrl !== "string" ||
          !data.paymentUrl.trim()
        ) {
          throw new Error(
            "服务器没有返回支付地址，请检查支付网关配置和返回结果。"
          );
        }

        const paymentUrl = new URL(
          data.paymentUrl,
          window.location.href
        );

        if (paymentUrl.protocol !== "https:") {
          throw new Error("支付地址不是 HTTPS，已停止跳转。");
        }

        showMessage("订单已创建，正在跳转支付页面……", "success");

        window.location.assign(paymentUrl.href);
      } catch (error) {
        showMessage(
          error.message || "网络连接失败，请稍后重试。",
          "error"
        );

        payButton.disabled = false;
        payButton.textContent = "立即支付";
      }
    });
  </script>
</body>
</html>
