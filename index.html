
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f5f9">
  <title>支付宝 UID 入口</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      background: #f3f5f9;
      color: #263247;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px 22px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 28px #17255412;
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #e8f1ff;
      color: #1769e0;
      font-size: 30px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .muted {
      color: #8490a3;
      font-size: 13px;
      line-height: 1.8;
    }

    .order {
      margin-top: 24px;
      padding: 18px 12px;
      background: #f8fafc;
      border-radius: 12px;
    }

    .amount {
      margin-top: 8px;
      color: #263247;
      font-size: 34px;
      font-weight: 700;
    }

    .notice {
      margin-top: 18px;
      padding: 12px;
      background: #eff6ff;
      color: #334155;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.8;
      text-align: left;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px 12px;
      border: 0;
      border-radius: 10px;
      background: #1769e0;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    #message {
      min-height: 24px;
      margin-top: 14px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.8;
    }

    footer {
      margin-top: 22px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon" aria-hidden="true">UID</div>

    <h1>支付宝大额 UID 入口</h1>
    <div class="muted">演示订单页面</div>

    <section class="order" aria-label="演示订单信息">
      <div class="muted">演示订单号</div>
      <div id="orderId">正在加载...</div>

      <div class="muted" style="margin-top: 16px;">演示金额</div>
      <div class="amount" id="orderAmount">--</div>
    </section>

    <div class="notice">
      点击下方按钮将打开第三方收银台。第三方页面由服务提供方控制，
      可能仍显示其他支付选项。请核实收款方、金额及支付服务资质后再决定是否继续。
      本页面不生成真实收款码，也不验证真实付款结果。
    </div>

    <button id="checkoutBtn" type="button">
      打开第三方收银台
    </button>

    <div id="message" role="status" aria-live="polite">
      正在加载演示订单...
    </div>

    <footer>
      本页面仅用于界面演示<br>
      真实付款状态必须由服务端核验
    </footer>
  </main>

  <script>
    const message = document.getElementById("message");
    const checkoutBtn = document.getElementById("checkoutBtn");

    const checkoutUrl =
      "http://api.sf2027.xyz/Pay_Charges_index_mid_10867.html";

    checkoutBtn.addEventListener("click", () => {
      const opened = window.open(checkoutUrl, "_blank", "noopener");

      if (opened) {
        message.textContent = "已尝试打开第三方收银台，请在新标签页查看。";
      } else {
        message.textContent =
          "新窗口可能被浏览器拦截，请检查浏览器设置。";
      }
    });

    async function loadOrder() {
      try {
        const response = await fetch("/api/order");

        if (!response.ok) {
          throw new Error("订单接口请求失败");
        }

        const data = await response.json();

        if (
          typeof data.orderId !== "string" ||
          !Number.isFinite(Number(data.amount))
        ) {
          throw new Error("订单数据格式不正确");
        }

        document.getElementById("orderId").textContent = data.orderId;
        document.getElementById("orderAmount").textContent =
          "¥ " + Number(data.amount).toFixed(2);

        message.textContent =
          "当前显示的是演示订单，不代表实际应付金额或付款状态。";
      } catch (error) {
        document.getElementById("orderId").textContent = "暂不可用";
        document.getElementById("orderAmount").textContent = "--";
        message.textContent = "暂时无法加载演示订单，请稍后重试。";
        console.error(error);
      }
    }

    loadOrder();
  </script>
</body>
</html>
