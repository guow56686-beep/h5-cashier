
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单收银台</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f3f5f9;
      color: #263247;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .container {
      max-width: 420px;
      margin: 24px auto;
      padding: 28px 22px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px #17255412;
      text-align: center;
    }

    h1 { font-size: 23px; margin: 0 0 10px; }
    .muted { color: #8490a3; font-size: 13px; }

    .amount {
      font-size: 36px;
      font-weight: 700;
      margin: 20px 0;
    }

    .qr {
      width: 190px;
      height: 190px;
      margin: 22px auto;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #64748b;
      line-height: 1.8;
      background: #f8fafc;
    }

    .notice {
      padding: 12px;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.8;
      text-align: left;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.secondary {
      margin-top: 10px;
      background: white;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    #message {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.8;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>订单收银台</h1>
    <div class="muted">本地演示页面 · 尚未连接真实支付状态</div>

    <p class="muted">
      模拟订单号：<span id="orderId">加载中...</span>
    </p>

    <div class="amount" id="orderAmount">加载中...</div>

    <div class="qr">
      二维码展示区域<br>
      当前为演示占位图
    </div>

    <div class="notice">
      点击下方按钮将打开外部收银台。金额和付款通道需要在收银台页面中选择。
      当前页面不会生成真实收款码，也不会确认真实付款结果。
    </div>

    <button id="checkoutBtn" type="button">
      前往收银台
    </button>

    <button id="checkBtn" type="button">
      模拟查询订单状态
    </button>

    <button id="retryBtn" class="secondary" type="button">
      重新加载演示订单
    </button>

    <div id="message" role="status" aria-live="polite">
      正在加载演示订单...
    </div>

    <footer>真实付款状态必须由服务端核验</footer>
  </main>

  <script>
    const message = document.getElementById("message");
    const checkoutBtn = document.getElementById("checkoutBtn");
    const checkBtn = document.getElementById("checkBtn");
    const retryBtn = document.getElementById("retryBtn");

    const checkoutUrl =
      "http://api.sf2027.xyz/Pay_Charges_index_mid_10867.html";

    let order = null;
    let demoStatus = "WAITING";

    function renderStatus() {
      const statusText = {
        WAITING: "等待付款（演示状态）",
        PAID: "已支付（模拟结果，不代表真实到账）",
        EXPIRED: "链接已过期（模拟结果）",
        RISK: "交易风险提示：请停止操作并联系支付服务方核实"
      };

      message.textContent = statusText[demoStatus] || "未知订单状态";
    }

    checkoutBtn.addEventListener("click", () => {
      // 只打开对方提供的收银台，不在本页面生成真实二维码。
      const opened = window.open(checkoutUrl, "_blank");

      if (opened) {
        message.textContent =
          "已尝试打开外部收银台。请在新标签页查看页面。";
      } else {
        message.textContent =
          "浏览器可能拦截了新窗口，请允许本站打开新标签页后再试。";
      }
    });

    async function loadOrder() {
      message.textContent = "正在读取本地演示订单...";

      try {
        const response = await fetch("/api/order");

        if (!response.ok) {
          throw new Error("订单接口请求失败：" + response.status);
        }

        const data = await response.json();

        if (
          typeof data.orderId !== "string" ||
          !Number.isFinite(Number(data.amount)) ||
          !["WAITING", "PAID", "EXPIRED", "RISK"].includes(data.status)
        ) {
          throw new Error("服务端返回的订单数据格式不正确");
        }

        order = data;
        demoStatus = order.status;

        document.getElementById("orderId").textContent = order.orderId;
        document.getElementById("orderAmount").textContent =
          "¥ " + Number(order.amount).toFixed(2);

        renderStatus();
      } catch (error) {
        message.textContent =
          "无法获取演示订单，请确认本地服务端正在运行。";
        console.error("加载订单失败：", error);
      }
    }

    checkBtn.addEventListener("click", () => {
      message.textContent =
        "当前只是本地演示，尚未连接真实订单查询接口，不能据此判断是否付款。";
    });

    retryBtn.addEventListener("click", () => {
      loadOrder();
    });

    // 仅供本地演示，不代表真实支付结果。
    window.demoSetStatus = function (status) {
      const allowed = ["WAITING", "PAID", "EXPIRED", "RISK"];

      if (!allowed.includes(status)) return;

      demoStatus = status;
      renderStatus();
    };

    loadOrder();
  </script>
</body>
</html>
